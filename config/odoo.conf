[options]
# Server configuration
addons_path = /opt/odoo/addons,/opt/odoo/custom-addons,/opt/odoo/real-estate-crm/addons
data_dir = /opt/odoo/data
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
log_db = False

# Database configuration
db_host = localhost
db_port = 5432
db_user = odoo
db_password = your_secure_password_here
db_name = real_estate_crm
db_maxconn = 64
db_template = template0

# Server ports and workers
http_port = 8069
longpolling_port = 8072
workers = 4
max_cron_threads = 2

# Security
admin_passwd = your_admin_password_here
list_db = False
proxy_mode = True

# Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

# Email configuration
email_from = noreply@yourdomain.com
smtp_server = localhost
smtp_port = 587
smtp_ssl = True
smtp_user = your_email@yourdomain.com
smtp_password = your_email_password

# Session
session_dir = /opt/odoo/sessions

# File upload
max_file_upload_size = 134217728

# Timezone
timezone = UTC

# Translation
translate_modules = ['all']

# Additional options for production
without_demo = True
csv_internal_sep = ,
reportgz = False
server_wide_modules = base,web

# Real Estate CRM specific
real_estate_default_currency = USD
real_estate_image_quality = 95
real_estate_map_provider = openstreetmap