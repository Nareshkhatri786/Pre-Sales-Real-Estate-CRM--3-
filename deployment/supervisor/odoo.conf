[program:odoo]
command=/opt/odoo/venv/bin/python3 /opt/odoo/odoo-bin -c /opt/odoo/config/odoo.conf
directory=/opt/odoo
user=odoo
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/odoo.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/odoo_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
killasgroup=true
stopasgroup=true
priority=999

# Environment variables
environment=LANG="en_US.UTF-8",LC_ALL="en_US.UTF-8",PYTHONPATH="/opt/odoo:/opt/odoo/custom-addons"

# Process management
stopsignal=QUIT
stopwaitsecs=60
startsecs=10
startretries=3

# Logging
loglevel=info